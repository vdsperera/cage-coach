name: CI Quality Pipeline

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  verify:
    name: Lint, Test & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js runtime
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Static analysis & linting (ESLint 9)
        run: npm run lint

      - name: Code style verification (Prettier)
        run: npm run format

      - name: Unit & benchmark test suite (Vitest)
        run: npm test

      - name: Production bundle build (Vite + TypeScript)
        run: npm run build
